<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HearthClone – Full Featured</title>
  <style>
    :root {
      --bg: #0c0c18;
      --panel: #141e33;
      --accent: #e94560;
      --gold: #f0c040;
      --mana: #4fc3f7;
      --health: #e53935;
      --attack: #ffb300;
      --text: #eaeaea;
      --card-bg: linear-gradient(165deg, #2a3a55 0%, #1a2535 100%);
      --spell-bg: linear-gradient(165deg, #3a2a55 0%, #251a35 100%);
      --board-bg: rgba(0,0,0,0.42);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
    }

    h1 {
      margin: 8px 0 2px;
      font-size: 1.65rem;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(240,192,64,0.45);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    /* ========== DECK BUILDER ========== */
    #deckbuilder {
      width: 100%;
      max-width: 1140px;
      padding: 0 12px 24px;
      display: none;
    }
    #deckbuilder.active { display: block; }

    .db-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .db-stats { font-size: 1.05rem; color: var(--gold); }

    .db-columns {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
    }
    @media (max-width: 860px) { .db-columns { grid-template-columns: 1fr; } }

    .collection, .deck-list {
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2a3a5a;
      max-height: 64vh;
      overflow-y: auto;
    }

    .collection h3, .deck-list h3 {
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--mana);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
    }

    .db-card {
      width: 100%;
      height: 152px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 2px solid #4a6a8a;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .db-card.spell { background: var(--spell-bg); border-color: #7a5a9a; }
    .db-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.5); }
    .db-card.disabled { opacity: 0.38; cursor: not-allowed; }

    .keyword-badges {
      position: absolute;
      top: 26px;
      right: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 3;
    }
    .kw {
      font-size: 0.55rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .kw.taunt { background: #5d4037; color: #ffcc80; }
    .kw.divine-shield { background: #1565c0; color: #90caf9; }
    .kw.rush { background: #bf360c; color: #ffab91; }
    .kw.lifesteal { background: #2e7d32; color: #a5d6a7; }
    .kw.poisonous { background: #6a1b9a; color: #e1bee7; }

    .deck-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 0.84rem;
    }
    .deck-item .count {
      background: var(--mana);
      color: #0a1a2a;
      font-weight: 700;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem;
    }
    .deck-item button {
      margin-left: auto;
      padding: 2px 8px;
      font-size: 0.75rem;
      box-shadow: none;
    }

    /* ========== GAME ========== */
    #game {
      width: 100%;
      max-width: 980px;
      padding: 0 12px 14px;
      display: none;
      flex-direction: column;
      gap: 5px;
    }
    #game.active { display: flex; }

    .hero-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border-radius: 10px;
      padding: 6px 12px;
      border: 1px solid #2a3a5a;
      transition: box-shadow 0.25s;
    }
    .hero-bar.valid-target {
      box-shadow: 0 0 0 3px #4caf50, 0 0 16px rgba(76,175,80,0.45);
      cursor: pointer;
    }

    .hero-info { display: flex; align-items: center; gap: 10px; }

    .hero-portrait {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #0f3460;
      border: 3px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem;
      position: relative;
      transition: transform 0.2s;
    }
    .hero-portrait.damaged { animation: shake 0.4s; }

    .hero-health {
      position: absolute; bottom: -5px; right: -5px;
      background: var(--health); color: white;
      font-weight: 700; font-size: 0.78rem;
      width: 23px; height: 23px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #111;
    }

    .hero-power-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3a5a8a, #1a3a5a);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      position: relative;
    }
    .hero-power-btn:hover:not(:disabled) { transform: scale(1.08); filter: brightness(1.15); }
    .hero-power-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
    .hero-power-btn.ready { box-shadow: 0 0 10px rgba(240,192,64,0.5); }
    .hp-cost {
      position: absolute; bottom: -4px; right: -4px;
      background: var(--mana); color: #0a1a2a;
      font-size: 0.65rem; font-weight: 800;
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #0277bd;
    }

    .mana-crystals { display: flex; gap: 3px; flex-wrap: wrap; max-width: 190px; }
    .crystal {
      width: 14px; height: 14px; border-radius: 50%;
      background: #1a3a5a; border: 2px solid #2a5a8a;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .crystal.full {
      background: var(--mana); border-color: #81d4fa;
      box-shadow: 0 0 5px var(--mana);
    }

    .mana-text { font-size: 0.85rem; color: var(--mana); font-weight: 600; }

    .board-area {
      background: var(--board-bg);
      border-radius: 12px;
      min-height: 120px;
      padding: 8px;
      display: flex; justify-content: center; align-items: center;
      gap: 7px; flex-wrap: wrap;
      border: 1px dashed #334;
      position: relative;
    }

    .board-label {
      position: absolute; top: 3px; left: 10px;
      font-size: 0.65rem; opacity: 0.4;
      text-transform: uppercase; letter-spacing: 1px;
    }

    /* Cards & Minions */
    .card, .minion {
      width: 86px; height: 116px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 2px solid #4a6a8a;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .card.spell { background: var(--spell-bg); border-color: #7a5a9a; }

    .card:hover, .minion:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
    }

    .card.selected, .minion.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold), 0 8px 18px rgba(240,192,64,0.4);
      transform: translateY(-7px);
    }

    .card.playable {
      border-color: #4caf50;
      box-shadow: 0 0 11px rgba(76,175,80,0.5);
    }

    .minion.can-attack {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(233,69,96,0.5);
    }

    .minion.exhausted { opacity: 0.58; filter: grayscale(0.35); }
    .minion.valid-target {
      box-shadow: 0 0 0 3px #4caf50, 0 0 12px rgba(76,175,80,0.45);
    }
    .minion.has-taunt { border-color: #ffb74d; box-shadow: 0 0 8px rgba(255,183,77,0.35); }
    .minion.attacking { animation: lunge 0.35s ease-out; }
    .minion.damaged { animation: shake 0.4s; }
    .minion.dying { animation: deathFade 0.5s forwards; }

    .card-cost {
      position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px;
      background: var(--mana); color: #0a1a2a;
      font-weight: 800; font-size: 0.8rem;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #0277bd; z-index: 2;
    }

    .card-art {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
      border-bottom: 1px solid #2a4a6a;
      position: relative;
    }
    .card.spell .card-art { background: linear-gradient(180deg, #3a2a5f 0%, #1a0d2a 100%); }

    .divine-shield-ring {
      position: absolute;
      inset: 4px;
      border: 2px solid #64b5f6;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px #64b5f6;
    }

    .card-name {
      font-size: 0.6rem; text-align: center;
      padding: 2px 2px; background: rgba(0,0,0,0.55);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 600;
    }

    .card-stats {
      display: flex; justify-content: space-between;
      padding: 2px 5px 4px; background: rgba(0,0,0,0.4);
    }

    .stat {
      font-weight: 800; font-size: 0.88rem;
      width: 19px; height: 19px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .stat.attack { background: var(--attack); color: #1a1200; border: 2px solid #e65100; }
    .stat.health { background: var(--health); color: white; border: 2px solid #b71c1c; }

    .hand .card { width: 94px; height: 126px; }
    .hand {
      display: flex; justify-content: center; gap: 6px;
      flex-wrap: wrap; min-height: 130px; padding: 6px;
      background: rgba(0,0,0,0.25); border-radius: 12px;
    }

    .opp-hand .card {
      width: 64px; height: 88px;
      background: linear-gradient(145deg, #3a1a4a, #1a0a2a);
      border-color: #6a3a8a; cursor: default;
    }
    .opp-hand .card:hover { transform: none; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .opp-hand .card-art { font-size: 1.4rem; }

    .controls {
      display: flex; justify-content: center; gap: 10px; margin-top: 3px; flex-wrap: wrap;
    }

    button {
      background: linear-gradient(180deg, #e94560, #c23a51);
      color: white; border: none;
      padding: 8px 18px; border-radius: 8px;
      font-weight: 700; font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #8b1e2e;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8b1e2e; }
    button:disabled {
      background: #555; box-shadow: 0 3px 0 #333;
      cursor: not-allowed; filter: none;
    }
    button.secondary {
      background: linear-gradient(180deg, #4a6fa5, #3a5a85);
      box-shadow: 0 3px 0 #2a4060;
    }
    button.success {
      background: linear-gradient(180deg, #43a047, #2e7d32);
      box-shadow: 0 3px 0 #1b5e20;
    }

    #message {
      text-align: center; min-height: 24px;
      font-size: 0.92rem; color: var(--gold);
      font-weight: 600; margin: 1px 0;
    }

    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center;
      z-index: 100; flex-direction: column; gap: 14px;
    }
    #overlay.show { display: flex; }
    #overlay h2 {
      font-size: 2.4rem; color: var(--gold);
      text-shadow: 0 0 20px rgba(240,192,64,0.5);
    }

    #log {
      max-height: 78px; overflow-y: auto;
      background: rgba(0,0,0,0.4); border-radius: 8px;
      padding: 6px 11px; font-size: 0.74rem;
      line-height: 1.3; opacity: 0.85;
      width: 100%; max-width: 980px;
    }
    #log div { margin-bottom: 1px; }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 200;
      background: linear-gradient(165deg, #1e2a45, #121c30);
      border: 1px solid #4a6a9a;
      border-radius: 10px;
      padding: 10px 14px;
      max-width: 240px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      font-size: 0.82rem;
    }
    #tooltip.show { opacity: 1; transform: translateY(0); }
    #tooltip .tt-name { font-weight: 700; color: var(--gold); margin-bottom: 4px; font-size: 0.95rem; }
    #tooltip .tt-type { font-size: 0.72rem; opacity: 0.7; margin-bottom: 6px; }
    #tooltip .tt-text { line-height: 1.35; margin-bottom: 6px; }
    #tooltip .tt-kw { display: flex; flex-wrap: wrap; gap: 4px; }

    /* Floating combat text */
    .float-text {
      position: absolute;
      font-weight: 800; font-size: 1.25rem;
      pointer-events: none; z-index: 50;
      animation: floatUp 0.85s forwards;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .float-text.damage { color: #ff5252; }
    .float-text.heal { color: #69f0ae; }

    /* Animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    @keyframes lunge {
      0% { transform: translateY(0); }
      40% { transform: translateY(-16px) scale(1.06); }
      100% { transform: translateY(0); }
    }
    @keyframes deathFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.55) rotate(6deg); }
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(1.15); }
    }

    @media (max-width: 600px) {
      .card, .minion { width: 68px; height: 96px; }
      .hand .card { width: 76px; height: 106px; }
      .card-art { font-size: 1.5rem; }
      .card-name { font-size: 0.52rem; }
      .hero-power-btn { width: 36px; height: 36px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>⚔ HearthClone</h1>
  <div class="subtitle">Keywords • Hero Powers • Tooltips • Sounds • Smarter AI</div>

  <!-- DECK BUILDER -->
  <div id="deckbuilder" class="active">
    <div class="db-header">
      <div class="db-stats">
        Deck: <span id="deck-count">0</span> / 30
        <span id="deck-warning" style="color:#e94560; margin-left:8px;"></span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="secondary" onclick="randomDeck()">Random Deck</button>
        <button class="secondary" onclick="clearDeck()">Clear</button>
        <button class="success" id="start-btn" onclick="startFromBuilder()" disabled>Start Match</button>
      </div>
    </div>
    <div class="db-columns">
      <div class="collection">
        <h3>Card Collection</h3>
        <div class="card-grid" id="collection-grid"></div>
      </div>
      <div class="deck-list">
        <h3>Your Deck</h3>
        <div id="deck-items"></div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="hero-bar" id="opp-bar">
      <div class="hero-info">
        <div class="hero-portrait" id="opp-portrait">👹
          <div class="hero-health" id="opp-health">30</div>
        </div>
        <div>
          <div style="font-weight:600">Shadow Lord</div>
          <div class="mana-text"><span id="opp-mana">0</span>/<span id="opp-max-mana">0</span> Mana</div>
        </div>
        <button class="hero-power-btn" id="opp-hp" disabled title="Enemy Hero Power">💀<span class="hp-cost">2</span></button>
      </div>
      <div class="mana-crystals" id="opp-crystals"></div>
    </div>

    <div class="board-area" id="opp-board"><span class="board-label">Enemy Board</span></div>
    <div class="opp-hand hand" id="opp-hand"></div>

    <div id="message">Build a deck to begin</div>

    <div class="board-area" id="player-board"><span class="board-label">Your Board</span></div>
    <div class="hand" id="player-hand"></div>

    <div class="hero-bar" id="player-bar">
      <div class="hero-info">
        <div class="hero-portrait" id="player-portrait">🧙
          <div class="hero-health" id="player-health">30</div>
        </div>
        <div>
          <div style="font-weight:600">You (Mage)</div>
          <div class="mana-text"><span id="player-mana">0</span>/<span id="player-max-mana">0</span> Mana</div>
        </div>
        <button class="hero-power-btn" id="player-hp" onclick="useHeroPower()" title="Fireblast: Deal 1 damage">🔥<span class="hp-cost">2</span></button>
      </div>
      <div class="mana-crystals" id="player-crystals"></div>
    </div>

    <div class="controls">
      <button id="end-turn-btn" onclick="endTurn()">End Turn</button>
      <button class="secondary" onclick="backToBuilder()">Deck Builder</button>
      <button class="secondary" onclick="newGameSameDeck()">Rematch</button>
    </div>
  </div>

  <div id="log"></div>

  <div id="overlay">
    <h2 id="overlay-title">Victory!</h2>
    <button onclick="newGameSameDeck()">Play Again</button>
    <button class="secondary" onclick="backToBuilder()">Change Deck</button>
  </div>

  <div id="tooltip"></div>

  <script>
    // ============================================================
    // SOUND ENGINE (Web Audio – no external files)
    // ============================================================
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, type = "square", duration = 0.08, volume = 0.08, slideTo = null) {
      try {
        ensureAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) osc.frequency.linearRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const SFX = {
      click:   () => playTone(600, "square", 0.04, 0.05),
      draw:    () => playTone(440, "triangle", 0.1, 0.06, 660),
      play:    () => { playTone(320, "square", 0.07, 0.07); setTimeout(() => playTone(480, "square", 0.06, 0.05), 50); },
      spell:   () => { playTone(520, "sine", 0.12, 0.07, 780); playTone(260, "triangle", 0.15, 0.04); },
      attack:  () => playTone(180, "sawtooth", 0.09, 0.08, 90),
      damage:  () => playTone(140, "square", 0.1, 0.09, 70),
      heal:    () => playTone(520, "sine", 0.12, 0.06, 780),
      shield:  () => playTone(880, "sine", 0.08, 0.05),
      death:   () => playTone(120, "sawtooth", 0.2, 0.08, 40),
      hp:      () => playTone(700, "triangle", 0.1, 0.06),
      win:     () => { playTone(523, "sine", 0.15, 0.07); setTimeout(() => playTone(659, "sine", 0.15, 0.07), 120); setTimeout(() => playTone(784, "sine", 0.25, 0.08), 240); },
      lose:    () => { playTone(300, "sawtooth", 0.2, 0.07, 150); setTimeout(() => playTone(180, "sawtooth", 0.3, 0.06, 80), 180); },
      turn:    () => playTone(400, "triangle", 0.08, 0.05)
    };

    // ============================================================
    // CARD DATABASE (with keywords)
    // ============================================================
    const CARD_POOL = [
      // Early game
      { id: 1,  name: "Forest Wolf",      type: "minion", cost: 1, attack: 1, health: 2, emoji: "🐺", text: "", keywords: [] },
      { id: 2,  name: "Goblin Scout",     type: "minion", cost: 1, attack: 2, health: 1, emoji: "👺", text: "", keywords: [] },
      { id: 3,  name: "Shieldbearer",     type: "minion", cost: 1, attack: 0, health: 4, emoji: "🛡️", text: "Taunt", keywords: ["taunt"] },

      // Spells
      { id: 30, name: "Arcane Bolt",      type: "spell", cost: 1, emoji: "✨", text: "Deal 2 damage.", target: "any",
        effect: (ctx, t) => dealDamage(ctx, t, 2) },
      { id: 31, name: "Holy Light",       type: "spell", cost: 2, emoji: "💚", text: "Restore 5 Health to your hero.", target: "none",

      { id: 32, name: "Quick Draw",       type: "spell", cost: 2, emoji: "📜", text: "Draw 2 cards.", target: "none",
        effect: () => { drawCard("player"); drawCard("player"); } },
      { id: 33, name: "Shadow Word",      type: "spell", cost: 3, emoji: "🌑", text: "Destroy a minion with 3 or less Attack.", target: "enemy_minion",
        canTarget: m => m.attack <= 3,
        effect: (ctx, t) => { if (t && t.attack <= 3) destroyMinion(null, t, "opponent"); } },
      { id: 34, name: "Fireball",         type: "spell", cost: 4, emoji: "🔥", text: "Deal 6 damage.", target: "any",
        effect: (ctx, t) => dealDamage(ctx, t, 6) },
      { id: 35, name: "Blessing",         type: "spell", cost: 2, emoji: "🛡️", text: "Give a friendly minion +2/+2.", target: "friendly_minion",
        effect: (ctx, t) => {
          if (t) { t.attack += 2; t.currentHealth += 2; t.health += 2; log(`${t.name} gains +2/+2.`); SFX.heal(); }
        } },
      { id: 36, name: "Lightning Storm",  type: "spell", cost: 3, emoji: "⚡", text: "Deal 2 damage to all enemy minions.", target: "none",
        effect: () => { [...state.opponent.board].forEach(m => dealDamage(null, m, 2)); } },
      { id: 37, name: "Soul Drain",       type: "spell", cost: 3, emoji: "🩸", text: "Deal 3 damage. Restore 3 Health to your hero.", target: "any",
        effect: (ctx, t) => { dealDamage(ctx, t, 3); healHero(null, "player", 3); } },
      { id: 38, name: "Execute",          type: "spell", cost: 2, emoji: "⚔️", text: "Destroy a damaged enemy minion.", target: "enemy_minion",
        canTarget: m => m.currentHealth < m.health,
        effect: (ctx, t) => { if (t && t.currentHealth < t.health) destroyMinion(null, t, "opponent"); } },
    ];

    // ============================================================
    // STATE
    // ============================================================
    let state = {
      phase: "builder",
      playerDeckList: [],
      player: null,
      opponent: null,
      turn: "player",
      selectedCard: null,
      selectedMinion: null,
      targeting: null,
      gameOver: false,
      log: []
    };

    // ============================================================
    // HELPERS
    // ============================================================
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function shuffle(a) {
      const arr = [...a];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function log(msg) {
      state.log.unshift(msg);
      if (state.log.length > 55) state.log.pop();
      renderLog();
    }
    function renderLog() {
      document.getElementById("log").innerHTML = state.log.map(m => `<div>${m}</div>`).join("");
    }
    function setMessage(t) { document.getElementById("message").textContent = t; }
    function getCardById(id) { return CARD_POOL.find(c => c.id === id); }

    // ============================================================
    // TOOLTIP
    // ============================================================
    const tooltipEl = document.getElementById("tooltip");
    function showTooltip(e, cardOrMinion) {
      const c = cardOrMinion;
      const isMinion = c.currentHealth !== undefined || c.type === "minion";
      let html = `<div class="tt-name">${c.emoji} ${c.name}</div>`;
      html += `<div class="tt-type">${c.type === "spell" ? "Spell" : "Minion"} • ${c.cost} Mana</div>`;
      if (c.text) html += `<div class="tt-text">${c.text}</div>`;
      if (c.keywords && c.keywords.length) {
        html += `<div class="tt-kw">${c.keywords.map(k => `<span class="kw ${k}">${k.replace("-", " ")}</span>`).join("")}</div>`;
      }
      if (isMinion && c.attack !== undefined) {
        html += `<div style="margin-top:6px;font-size:0.8rem;">${c.attack} / ${c.currentHealth ?? c.health}</div>`;
      }
      tooltipEl.innerHTML = html;
      tooltipEl.classList.add("show");
      positionTooltip(e);
    }
    function positionTooltip(e) {
      const pad = 12;
      let x = e.clientX + 14;
      let y = e.clientY + 14;
      const rect = tooltipEl.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - pad) x = e.clientX - rect.width - 10;
      if (y + rect.height > window.innerHeight - pad) y = e.clientY - rect.height - 10;
      tooltipEl.style.left = x + "px";
      tooltipEl.style.top = y + "px";
    }
    function hideTooltip() { tooltipEl.classList.remove("show"); }
    document.addEventListener("mousemove", e => {
      if (tooltipEl.classList.contains("show")) positionTooltip(e);
    });

    // ============================================================
    // COMBAT / KEYWORDS
    // ============================================================
    function dealDamage(ctx, target, amount, source = null) {
      if (!target || amount <= 0) return 0;

      if (target === "hero" || target.isHero) {
        const who = target.owner || "opponent";
        state[who].health -= amount;
        showFloat(who === "player" ? "player-portrait" : "opp-portrait", `-${amount}`, "damage");
        const port = document.getElementById(who === "player" ? "player-portrait" : "opp-portrait");
        if (port) { port.classList.add("damaged"); setTimeout(() => port.classList.remove("damaged"), 400); }
        SFX.damage();
        log(`${amount} damage to ${who === "player" ? "you" : "enemy hero"}.`);
        if (source && source.hasLifesteal) {
          const owner = state.player.board.some(m => m.instanceId === source.instanceId) ? "player" : "opponent";
          healHero(null, owner, amount);
        }
        checkHeroDeath();
        return amount;
      }

      if (target.hasDivineShield) {
        target.hasDivineShield = false;
        SFX.shield();
        log(`${target.name}'s Divine Shield absorbs the damage!`);
        const el = document.querySelector(`[data-id="${target.instanceId}"]`);
        if (el) {
          const ring = el.querySelector(".divine-shield-ring");
          if (ring) ring.remove();
        }
        return 0;
      }

      target.currentHealth -= amount;
      showFloatOnMinion(target, `-${amount}`, "damage");
      const el = document.querySelector(`[data-id="${target.instanceId}"]`);
      if (el) { el.classList.add("damaged"); setTimeout(() => el.classList.remove("damaged"), 400); }
      SFX.damage();
      log(`${target.name} takes ${amount} damage.`);

      if (source && source.hasLifesteal) {
        const owner = state.player.board.some(m => m.instanceId === source.instanceId) ? "player" : "opponent";
        healHero(null, owner, amount);
      }

      if (source && source.hasPoisonous && amount > 0) {
        const owner = state.player.board.some(m => m.instanceId === target.instanceId) ? "player" : "opponent";
        destroyMinion(null, target, owner);
        return amount;
      }

      if (target.currentHealth <= 0) {
        const owner = state.player.board.some(m => m.instanceId === target.instanceId) ? "player" : "opponent";
        destroyMinion(null, target, owner);
      }
      return amount;
    }

    function healHero(ctx, who, amount) {
      const p = state[who];
      const before = p.health;
      p.health = Math.min(30, p.health + amount);
      const healed = p.health - before;
      if (healed > 0) {
        showFloat(who === "player" ? "player-portrait" : "opp-portrait", `+${healed}`, "heal");
        SFX.heal();
        log(`${who === "player" ? "You" : "Enemy"} heal for ${healed}.`);
      }
    }

    function destroyMinion(ctx, minion, owner) {
      SFX.death();
      const el = document.querySelector(`[data-id="${minion.instanceId}"]`);
      if (el) {
        el.classList.add("dying");
        setTimeout(() => {
          state[owner].board = state[owner].board.filter(m => m.instanceId !== minion.instanceId);
          log(`${minion.name} is destroyed.`);
          render();
        }, 480);
      } else {
        state[owner].board = state[owner].board.filter(m => m.instanceId !== minion.instanceId);
        log(`${minion.name} is destroyed.`);
      }
    }

    function checkHeroDeath() {
      if (state.player.health <= 0) endGame("loss");
      else if (state.opponent.health <= 0) endGame("win");
    }

    function showFloat(id, text, type) {
      const parent = document.getElementById(id);
      if (!parent) return;
      const f = document.createElement("div");
      f.className = `float-text ${type}`;
      f.textContent = text;
      f.style.left = "50%"; f.style.top = "0"; f.style.transform = "translateX(-50%)";
      parent.style.position = "relative";
      parent.appendChild(f);
      setTimeout(() => f.remove(), 850);
    }
    function showFloatOnMinion(minion, text, type) {
      const el = document.querySelector(`[data-id="${minion.instanceId}"]`);
      if (!el) return;
      const f = document.createElement("div");
      f.className = `float-text ${type}`;
      f.textContent = text;
      f.style.left = "50%"; f.style.top = "18%"; f.style.transform = "translateX(-50%)";
      el.style.position = "relative";
      el.appendChild(f);
      setTimeout(() => f.remove(), 850);
    }

    function enemyHasTaunt() {
      return state.opponent.board.some(m => m.hasTaunt && m.currentHealth > 0);
    }
    function playerHasTaunt() {
      return state.player.board.some(m => m.hasTaunt && m.currentHealth > 0);
    }

    // ============================================================
    // DECK BUILDER
    // ============================================================
    function renderBuilder() {
      const grid = document.getElementById("collection-grid");
      grid.innerHTML = "";
      CARD_POOL.forEach(card => {
        const count = state.playerDeckList.filter(id => id === card.id).length;
        const el = document.createElement("div");
        el.className = `db-card ${card.type}` + (count >= 2 ? " disabled" : "");
        let kwHtml = "";
        if (card.keywords && card.keywords.length) {
          kwHtml = `<div class="keyword-badges">${card.keywords.map(k => `<span class="kw ${k}">${k.replace("-"," ")}</span>`).join("")}</div>`;
        }
        el.innerHTML = `
          <div class="card-cost">${card.cost}</div>
          ${kwHtml}
          <div class="card-art">${card.emoji}</div>
          <div class="card-name">${card.name}</div>
          <div class="card-stats">
            ${card.type === "minion"
              ? `<div class="stat attack">${card.attack}</div><div class="stat health">${card.health}</div>`
              : `<div style="font-size:0.62rem;padding:2px;opacity:0.85;text-align:center;width:100%">${card.text}</div>`}
          </div>`;
        el.onmouseenter = e => showTooltip(e, card);
        el.onmouseleave = hideTooltip;
        el.onclick = () => { SFX.click(); addToDeck(card.id); };
        grid.appendChild(el);
      });

      const items = document.getElementById("deck-items");
      items.innerHTML = "";
      const counts = {};
      state.playerDeckList.forEach(id => counts[id] = (counts[id] || 0) + 1);
      Object.entries(counts).forEach(([id, cnt]) => {
        const card = getCardById(+id);
        const div = document.createElement("div");
        div.className = "deck-item";
        div.innerHTML = `
          <span class="count">${cnt}</span>
          <span>${card.emoji} ${card.name}</span>
          <span style="opacity:0.55;font-size:0.72rem;">(${card.cost})</span>
          <button class="secondary" onclick="removeFromDeck(${id})">−</button>`;
        items.appendChild(div);
      });

      const total = state.playerDeckList.length;
      document.getElementById("deck-count").textContent = total;
      const warn = document.getElementById("deck-warning");
      const btn = document.getElementById("start-btn");
      if (total < 15) { warn.textContent = "Need ≥ 15 cards"; btn.disabled = true; }
      else if (total > 30) { warn.textContent = "Max 30 cards"; btn.disabled = true; }
      else { warn.textContent = ""; btn.disabled = false; }
    }

    function addToDeck(id) {
      if (state.playerDeckList.filter(x => x === id).length >= 2 || state.playerDeckList.length >= 30) return;
      state.playerDeckList.push(id);
      renderBuilder();
    }
    function removeFromDeck(id) {
      const i = state.playerDeckList.indexOf(id);
      if (i !== -1) state.playerDeckList.splice(i, 1);
      renderBuilder();
    }
    function clearDeck() { state.playerDeckList = []; renderBuilder(); }
    function randomDeck() {
      state.playerDeckList = [];
      const pool = [...CARD_POOL];
      while (state.playerDeckList.length < 26) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        if (state.playerDeckList.filter(id => id === c.id).length < 2) state.playerDeckList.push(c.id);
      }
      renderBuilder();
    }
    function startFromBuilder() {
      if (state.playerDeckList.length < 15 || state.playerDeckList.length > 30) return;
      document.getElementById("deckbuilder").classList.remove("active");
      document.getElementById("game").classList.add("active");
      SFX.click();
      newGame();
    }
    function backToBuilder() {
      document.getElementById("overlay").classList.remove("show");
      document.getElementById("game").classList.remove("active");
      document.getElementById("deckbuilder").classList.add("active");
      state.phase = "builder";
      state.gameOver = false;
      hideTooltip();
      renderBuilder();
    }

    // ============================================================
    // GAME INIT
    // ============================================================
    function buildDeckFromList(list) {
      return shuffle(list.map(id => {
        const base = getCardById(id);
        return { ...base, instanceId: uid() };
      }));
    }
    function createPlayer(deckList) {
      return {
        health: 30, mana: 0, maxMana: 0,
        deck: buildDeckFromList(deckList),
        hand: [], board: [], fatigue: 0,
        heroPowerUsed: false
      };
    }

    function newGame() {
      document.getElementById("overlay").classList.remove("show");
      state.gameOver = false;
      state.selectedCard = null;
      state.selectedMinion = null;
      state.targeting = null;
      state.log = [];

      const aiList = [];
      CARD_POOL.forEach(c => {
        aiList.push(c.id);
        if (c.cost <= 4 || (c.keywords && c.keywords.length)) aiList.push(c.id);
      });
      state.opponent = createPlayer(aiList);
      state.player = createPlayer(state.playerDeckList);

      for (let i = 0; i < 3; i++) {
        drawCard("player", true);
        drawCard("opponent", true);
      }
      drawCard("player", true);

      log("Game started. You go first.");
      startTurn("player");
    }

    function newGameSameDeck() {
      if (state.playerDeckList.length < 15) { backToBuilder(); return; }
      document.getElementById("deckbuilder").classList.remove("active");
      document.getElementById("game").classList.add("active");
      newGame();
    }

    // ============================================================
    // DRAW / PLAY / HERO POWER / ATTACK
    // ============================================================
    function drawCard(who, silent = false) {
      const p = state[who];
      if (p.deck.length === 0) {
        p.fatigue++;
        p.health -= p.fatigue;
        log(`${who === "player" ? "You" : "Enemy"} take ${p.fatigue} fatigue.`);
        checkHeroDeath();
        return;
      }
      if (p.hand.length >= 10) {
        const burned = p.deck.pop();
        log(`${who === "player" ? "You" : "Enemy"} burn ${burned.name}.`);
        return;
      }
      const card = p.deck.pop();
      p.hand.push(card);
      if (!silent && who === "player") { log(`You draw ${card.name}.`); SFX.draw(); }
    }

    function createMinionFromCard(card) {
      return {
        ...card,
        currentHealth: card.health,
        canAttack: !!card.keywords?.includes("rush"),
        exhausted: !card.keywords?.includes("rush"),
        hasTaunt: !!card.keywords?.includes("taunt"),
        hasDivineShield: !!card.keywords?.includes("divine-shield"),
        hasRush: !!card.keywords?.includes("rush"),
        hasLifesteal: !!card.keywords?.includes("lifesteal"),
        hasPoisonous: !!card.keywords?.includes("poisonous")
      };
    }

    function playCard(card, target = null) {
      const p = state.player;
      if (p.mana < card.cost) return false;

      if (card.type === "minion") {
        if (p.board.length >= 7) { setMessage("Board full!"); return false; }
        p.mana -= card.cost;
        p.hand = p.hand.filter(c => c.instanceId !== card.instanceId);
        p.board.push(createMinionFromCard(card));
        log(`You play ${card.name}${card.keywords?.length ? " (" + card.keywords.join(", ") + ")" : ""}.`);
        SFX.play();
        state.selectedCard = null;
        state.targeting = null;
        render();
        return true;
      }

      if (card.target === "none") {
        p.mana -= card.cost;
        p.hand = p.hand.filter(c => c.instanceId !== card.instanceId);
        log(`You cast ${card.name}.`);
        SFX.spell();
        card.effect({ owner: "player" });
        state.selectedCard = null;
        state.targeting = null;
        render();
        return true;
      }

      if (target) {
        p.mana -= card.cost;
        p.hand = p.hand.filter(c => c.instanceId !== card.instanceId);
        log(`You cast ${card.name}.`);
        SFX.spell();
        card.effect({ owner: "player" }, target);
        state.selectedCard = null;
        state.targeting = null;
        render();
        return true;
      }

      state.targeting = { type: "spell", card };
      state.selectedCard = card;
      setMessage(`Choose a target for ${card.name}`);
      render();
      return false;
    }

    function useHeroPower() {
      if (state.turn !== "player" || state.gameOver) return;
      const p = state.player;
      if (p.heroPowerUsed) { setMessage("Hero Power already used this turn."); return; }
      if (p.mana < 2) { setMessage("Not enough mana (2)."); return; }

      state.targeting = { type: "heropower" };
      state.selectedCard = null;
      state.selectedMinion = null;
      setMessage("Fireblast – choose a target (minion or hero)");
      render();
    }

    function resolveHeroPower(target) {
      const p = state.player;
      p.mana -= 2;
      p.heroPowerUsed = true;
      log("You use Fireblast.");
      SFX.hp();
      dealDamage(null, target, 1);
      state.targeting = null;
      render();
    }

    function attack(attacker, target) {
      if (!attacker.canAttack || attacker.exhausted) return;

      if (target === "hero" || target.isHero) {
        if (enemyHasTaunt()) {
          setMessage("A minion with Taunt is in the way!");
          return;
        }
      } else {
        if (enemyHasTaunt() && !target.hasTaunt) {
          setMessage("You must attack a Taunt minion first!");
          return;
        }
      }

      const el = document.querySelector(`[data-id="${attacker.instanceId}"]`);
      if (el) { el.classList.add("attacking"); setTimeout(() => el.classList.remove("attacking"), 340); }
      SFX.attack();

      if (target === "hero" || target.isHero) {
        dealDamage(null, { isHero: true, owner: "opponent" }, attacker.attack, attacker);
      } else {
        dealDamage(null, target, attacker.attack, attacker);
        if (state.player.board.some(m => m.instanceId === attacker.instanceId) ||
            state.opponent.board.some(m => m.instanceId === attacker.instanceId)) {
          dealDamage(null, attacker, target.attack, target);
        }
      }

      attacker.canAttack = false;
      attacker.exhausted = true;
      state.selectedMinion = null;
      render();
    }

    // ============================================================
    // TURNS
    // ============================================================
    function startTurn(who) {
      const p = state[who];
      p.maxMana = Math.min(10, p.maxMana + 1);
      p.mana = p.maxMana;
      p.heroPowerUsed = false;
      p.board.forEach(m => {
        m.canAttack = true;
        m.exhausted = false;
      });
      drawCard(who);

      state.turn = who;
      state.selectedCard = null;
      state.selectedMinion = null;
      state.targeting = null;

      if (who === "player") {
        setMessage("Your turn");
        document.getElementById("end-turn-btn").disabled = false;
        SFX.turn();
      } else {
        setMessage("Enemy is thinking...");
        document.getElementById("end-turn-btn").disabled = true;
        setTimeout(aiTurn, 700);
      }
      render();
    }

    function endTurn() {
      if (state.turn !== "player" || state.gameOver) return;
      state.selectedCard = null;
      state.selectedMinion = null;
      state.targeting = null;
      log("--- You end turn ---");
      startTurn("opponent");
    }

    // ============================================================
    // SOPHISTICATED AI
    // ============================================================
    function aiTurn() {
      const opp = state.opponent;
      const me = state.player;

      function canLethal() {
        let dmg = 0;
        opp.board.filter(m => m.canAttack).forEach(m => dmg += m.attack);
        if (!playerHasTaunt()) {
          if (!opp.heroPowerUsed && opp.mana >= 2) dmg += 1;
          opp.hand.forEach(c => {
            if (c.type === "spell" && c.cost <= opp.mana) {
              if (c.id === 30) dmg += 2;
              if (c.id === 34) dmg += 6;
              if (c.id === 37) dmg += 3;
            }
          });
        }
        return dmg >= me.health;
      }

      let safety = 14;
      while (safety-- > 0) {
        const options = opp.hand
          .filter(c => c.cost <= opp.mana)
          .map(c => {
            let score = 0;
            if (c.type === "minion") {
              score = (c.attack + c.health) * 1.3 - c.cost * 0.8;
              if (c.keywords?.includes("taunt")) score += 4;
              if (c.keywords?.includes("divine-shield")) score += 3;
              if (c.keywords?.includes("rush")) score += 2.5;
              if (c.keywords?.includes("lifesteal")) score += 2;
              if (c.keywords?.includes("poisonous")) score += 3;
              if (opp.board.length >= 6) score -= 6;
            } else {
              if (c.id === 34) score = 11;
              else if (c.id === 36) score = me.board.length >= 2 ? 9 : 2;
              else if (c.id === 33) {
                const weak = me.board.filter(m => m.attack <= 3);
                score = weak.length ? 10 : -12;
              } else if (c.id === 38) {
                const dmgd = me.board.filter(m => m.currentHealth < m.health);
                score = dmgd.length ? 9 : -10;
              } else if (c.id === 30) score = 5;
              else if (c.id === 37) score = 7;
              else if (c.id === 31) score = opp.health < 20 ? 6 : 2;
              else score = 3;
            }
            return { card: c, score };
          })
          .filter(o => o.score > -8)
          .sort((a, b) => b.score - a.score);

        if (!options.length) break;
        const best = options[0].card;

        if (best.type === "minion" && opp.board.length < 7) {
          opp.mana -= best.cost;
          opp.hand = opp.hand.filter(c => c.instanceId !== best.instanceId);
          opp.board.push(createMinionFromCard(best));
          log(`Enemy plays ${best.name}.`);
          SFX.play();
        } else if (best.type === "spell") {
          let target = null;
          if (best.target === "none") {
            opp.mana -= best.cost;
            opp.hand = opp.hand.filter(c => c.instanceId !== best.instanceId);
            log(`Enemy casts ${best.name}.`);
            SFX.spell();
            if (best.id === 31) healHero(null, "opponent", 5);
            else if (best.id === 32) { drawCard("opponent"); drawCard("opponent"); }
            else if (best.id === 36) [...state.player.board].forEach(m => dealDamage(null, m, 2));
          } else {
            if (best.id === 33) target = me.board.filter(m => m.attack <= 3).sort((a,b) => b.attack - a.attack)[0];
            else if (best.id === 38) target = me.board.filter(m => m.currentHealth < m.health).sort((a,b) => b.attack - a.attack)[0];
            else {
              const threats = [...me.board].sort((a,b) => {
                let sa = a.attack * 2 + (a.hasTaunt ? 5 : 0) + (a.hasDivineShield ? 3 : 0);
                let sb = b.attack * 2 + (b.hasTaunt ? 5 : 0) + (b.hasDivineShield ? 3 : 0);
                return sb - sa;
              });
              if (threats.length && (threats[0].attack >= 3 || threats[0].hasTaunt)) target = threats[0];
              else target = { isHero: true, owner: "player" };
            }
            if (target) {
              opp.mana -= best.cost;
              opp.hand = opp.hand.filter(c => c.instanceId !== best.instanceId);
              log(`Enemy casts ${best.name}.`);
              SFX.spell();
              if (best.id === 30) dealDamage(null, target, 2);
              else if (best.id === 34) dealDamage(null, target, 6);
              else if (best.id === 37) { dealDamage(null, target, 3); healHero(null, "opponent", 3); }
              else if (best.id === 33 || best.id === 38) destroyMinion(null, target, "player");
            }
          }
        }
        render();
      }

      if (!opp.heroPowerUsed && opp.mana >= 2) {
        const oneHealth = me.board.find(m => m.currentHealth === 1 && !m.hasDivineShield);
        if (canLethal() || oneHealth || me.health <= 5) {
          opp.mana -= 2;
          opp.heroPowerUsed = true;
          log("Enemy uses Hero Power.");
          SFX.hp();
          if (oneHealth) dealDamage(null, oneHealth, 1);
          else dealDamage(null, { isHero: true, owner: "player" }, 1);
          render();
        }
      }

      setTimeout(() => {
        const attackers = opp.board.filter(m => m.canAttack && !m.exhausted);
        attackers.sort((a, b) => b.attack - a.attack);

        attackers.forEach(attacker => {
          if (canLethal() && !playerHasTaunt()) {
            attackAI(attacker, "hero");
            return;
          }

          const targets = me.board.filter(m => m.currentHealth > 0);
          const taunts = targets.filter(m => m.hasTaunt);
          const validTargets = taunts.length ? taunts : targets;

          let bestTarget = null;
          let bestScore = -999;

          validTargets.forEach(t => {
            let score = 0;
            const kills = attacker.attack >= t.currentHealth || (attacker.hasPoisonous && !t.hasDivineShield);
            const dies = t.attack >= attacker.currentHealth && !attacker.hasDivineShield;
            if (kills && !dies) score = 25 + t.attack * 2 + (t.hasTaunt ? 6 : 0) + (t.hasDivineShield ? 4 : 0);
            else if (kills && dies) score = 10 + t.attack - attacker.attack * 0.5;
            else if (!kills && !dies) score = 1;
            else score = -12;
            if (t.hasDivineShield) score += 3;
            if (score > bestScore) { bestScore = score; bestTarget = t; }
          });

          if (bestTarget && bestScore >= 4) {
            attackAI(attacker, bestTarget);
          } else if (!playerHasTaunt()) {
            attackAI(attacker, "hero");
          } else if (bestTarget) {
            attackAI(attacker, bestTarget);
          }
        });

        render();
        setTimeout(() => {
          if (!state.gameOver) {
            log("--- Enemy ends turn ---");
            startTurn("player");
          }
        }, 520);
      }, 500);
    }

    function attackAI(attacker, target) {
      if (target === "hero") {
        if (playerHasTaunt()) return;
        dealDamage(null, { isHero: true, owner: "player" }, attacker.attack, attacker);
      } else {
        dealDamage(null, target, attacker.attack, attacker);
        if (state.opponent.board.some(m => m.instanceId === attacker.instanceId) ||
            state.player.board.some(m => m.instanceId === attacker.instanceId)) {
          dealDamage(null, attacker, target.attack, target);
        }
      }
      attacker.canAttack = false;
      attacker.exhausted = true;
    }

    // ============================================================
    // END GAME
    // ============================================================
    function endGame(result) {
      state.gameOver = true;
      document.getElementById("overlay-title").textContent = result === "win" ? "Victory!" : "Defeat...";
      document.getElementById("overlay").classList.add("show");
      log(result === "win" ? "You win!" : "You have been defeated.");
      if (result === "win") SFX.win(); else SFX.lose();
      render();
    }

    // ============================================================
    // RENDER & INTERACTION
    // ============================================================
    function createCardEl(card) {
      const el = document.createElement("div");
      el.className = `card ${card.type}`;
      if (state.turn === "player" && !state.gameOver) {
        if (card.cost <= state.player.mana) {
          if (card.type === "minion" && state.player.board.length < 7) el.classList.add("playable");
          if (card.type === "spell") el.classList.add("playable");
        }
        if (state.selectedCard && state.selectedCard.instanceId === card.instanceId) el.classList.add("selected");
      }

      let kw = "";
      if (card.keywords?.length) {
        kw = `<div class="keyword-badges">${card.keywords.map(k => `<span class="kw ${k}">${k.replace("-"," ")}</span>`).join("")}</div>`;
      }

      el.innerHTML = `
        <div class="card-cost">${card.cost}</div>
        ${kw}
        <div class="card-art">${card.emoji}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-stats">
          ${card.type === "minion"
            ? `<div class="stat attack">${card.attack}</div><div class="stat health">${card.health}</div>`
            : `<div style="font-size:0.58rem;opacity:0.85;text-align:center;width:100%;padding:1px">${card.text}</div>`}
        </div>`;

      el.onmouseenter = e => showTooltip(e, card);
      el.onmouseleave = hideTooltip;
      el.onclick = () => onHandClick(card);
      return el;
    }

    function createMinionEl(minion, owner) {
      const el = document.createElement("div");
      el.className = "minion";
      el.dataset.id = minion.instanceId;
      if (minion.hasTaunt) el.classList.add("has-taunt");
      if (minion.exhausted || !minion.canAttack) el.classList.add("exhausted");
      if (owner === "player" && state.turn === "player" && minion.canAttack && !minion.exhausted) el.classList.add("can-attack");
      if (state.selectedMinion && state.selectedMinion.instanceId === minion.instanceId) el.classList.add("selected");

      if (state.targeting) {
        const t = state.targeting;
        if (t.type === "spell") {
          const tgt = t.card.target;
          if (owner === "opponent" && (tgt === "any" || tgt === "enemy_minion")) {
            if (!t.card.canTarget || t.card.canTarget(minion)) el.classList.add("valid-target");
          }
          if (owner === "player" && tgt === "friendly_minion") el.classList.add("valid-target");
        } else if (t.type === "heropower") {
          el.classList.add("valid-target");
        }
      } else if (state.selectedMinion && owner === "opponent") {
        if (enemyHasTaunt()) {
          if (minion.hasTaunt) el.classList.add("valid-target");
        } else {
          el.classList.add("valid-target");
        }
      }

      let shield = minion.hasDivineShield ? `<div class="divine-shield-ring"></div>` : "";
      let kwBadges = "";
      if (minion.hasTaunt || minion.hasLifesteal || minion.hasPoisonous || minion.hasRush) {
        const ks = [];
        if (minion.hasTaunt) ks.push("taunt");
        if (minion.hasLifesteal) ks.push("lifesteal");
        if (minion.hasPoisonous) ks.push("poisonous");
        if (minion.hasRush) ks.push("rush");
        kwBadges = `<div class="keyword-badges">${ks.map(k => `<span class="kw ${k}">${k.replace("-"," ")}</span>`).join("")}</div>`;
      }

      el.innerHTML = `
        ${kwBadges}
        <div class="card-art">${minion.emoji}${shield}</div>
        <div class="card-name">${minion.name}</div>
        <div class="card-stats">
          <div class="stat attack">${minion.attack}</div>
          <div class="stat health">${minion.currentHealth}</div>
        </div>`;

      el.onmouseenter = e => showTooltip(e, minion);
      el.onmouseleave = hideTooltip;
      el.onclick = () => onMinionClick(minion, owner);
      return el;
    }

    function onHandClick(card) {
      if (state.gameOver || state.turn !== "player") return;
      SFX.click();

      if (state.targeting && state.selectedCard?.instanceId === card.instanceId) {
        state.targeting = null;
        state.selectedCard = null;
        setMessage("Cancelled.");
        render();
        return;
      }

      if (card.type === "minion") {
        if (state.selectedCard?.instanceId === card.instanceId) playCard(card);
        else {
          state.selectedCard = card;
          state.selectedMinion = null;
          state.targeting = null;
          setMessage(`Selected ${card.name} – click again to play`);
          render();
        }
      } else {
        if (card.target === "none") {
          if (state.selectedCard?.instanceId === card.instanceId) playCard(card);
          else {
            state.selectedCard = card;
            setMessage(`Selected ${card.name} – click again to cast`);
            render();
          }
        } else {
          state.selectedCard = card;
          state.targeting = { type: "spell", card };
          setMessage(`Choose a target for ${card.name}`);
          render();
        }
      }
    }

    function onMinionClick(minion, owner) {
      if (state.gameOver) return;

      if (state.targeting && state.turn === "player") {
        if (state.targeting.type === "heropower") {
          resolveHeroPower(minion);
          return;
        }
        const t = state.targeting.card.target;
        let valid = false;
        if ((t === "any" || t === "enemy_minion") && owner === "opponent") {
          if (!state.targeting.card.canTarget || state.targeting.card.canTarget(minion)) valid = true;
        }
        if (t === "friendly_minion" && owner === "player") valid = true;
        if (valid) playCard(state.targeting.card, minion);
        return;
      }

      if (owner === "player" && state.turn === "player") {
        if (minion.canAttack && !minion.exhausted) {
          state.selectedMinion = minion;
          state.selectedCard = null;
          state.targeting = null;
          setMessage(`Attack with ${minion.name}`);
          SFX.click();
          render();
        }
      } else if (owner === "opponent" && state.selectedMinion) {
        attack(state.selectedMinion, minion);
        setMessage("Attack resolved.");
      }
    }

    function render() {
      if (!state.player) return;

      document.getElementById("player-health").textContent = Math.max(0, state.player.health);
      document.getElementById("opp-health").textContent = Math.max(0, state.opponent.health);
      document.getElementById("player-mana").textContent = state.player.mana;
      document.getElementById("player-max-mana").textContent = state.player.maxMana;
      document.getElementById("opp-mana").textContent = state.opponent.mana;
      document.getElementById("opp-max-mana").textContent = state.opponent.maxMana;

      ["player", "opp"].forEach(who => {
        const el = document.getElementById(who + "-crystals");
        el.innerHTML = "";
        const cur = who === "player" ? state.player.mana : state.opponent.mana;
        for (let i = 0; i < 10; i++) {
          const c = document.createElement("div");
          c.className = "crystal" + (i < cur ? " full" : "");
          el.appendChild(c);
        }
      });

      const hpBtn = document.getElementById("player-hp");
      const canHP = state.turn === "player" && !state.player.heroPowerUsed && state.player.mana >= 2 && !state.gameOver;
      hpBtn.disabled = !canHP;
      hpBtn.classList.toggle("ready", canHP);

      const pBoard = document.getElementById("player-board");
      pBoard.innerHTML = '<span class="board-label">Your Board</span>';
      state.player.board.forEach(m => pBoard.appendChild(createMinionEl(m, "player")));

      const oBoard = document.getElementById("opp-board");
      oBoard.innerHTML = '<span class="board-label">Enemy Board</span>';
      state.opponent.board.forEach(m => oBoard.appendChild(createMinionEl(m, "opponent")));

      const pHand = document.getElementById("player-hand");
      pHand.innerHTML = "";
      state.player.hand.forEach(c => pHand.appendChild(createCardEl(c)));

      const oHand = document.getElementById("opp-hand");
      oHand.innerHTML = "";
      state.opponent.hand.forEach(() => {
        const back = document.createElement("div");
        back.className = "card";
        back.innerHTML = `<div class="card-art">🂠</div>`;
        oHand.appendChild(back);
      });

      const oppBar = document.getElementById("opp-bar");
      oppBar.classList.remove("valid-target");
      if (state.targeting) {
        if (state.targeting.type === "heropower" ||
            (state.targeting.type === "spell" && (state.targeting.card.target === "any" || state.targeting.card.target === "enemy"))) {
          oppBar.classList.add("valid-target");
        }
      } else if (state.selectedMinion && !enemyHasTaunt()) {
        oppBar.classList.add("valid-target");
      }

      oppBar.onclick = () => {
        if (state.gameOver || state.turn !== "player") return;
        if (state.targeting?.type === "heropower") {
          resolveHeroPower({ isHero: true, owner: "opponent" });
        } else if (state.targeting?.type === "spell" &&
                   (state.targeting.card.target === "any" || state.targeting.card.target === "enemy")) {
          playCard(state.targeting.card, { isHero: true, owner: "opponent" });
        } else if (state.selectedMinion) {
          attack(state.selectedMinion, "hero");
          setMessage("You attacked the enemy hero.");
        }
      };
    }

    // Start
    renderBuilder();
  </script>
</body>
</html>
